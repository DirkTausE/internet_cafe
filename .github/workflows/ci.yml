name: CI

on:
  push:
    branches: [ alpha-test1, alpha-preview ]
  pull_request:
    branches: [ alpha-test1, alpha-preview ]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Find and lint PHP files
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No PHP files to lint."
            exit 0
          fi
          for f in $files; do
            echo "Linting $f"
            php -l "$f"
          done

  python-lint:
    name: Python lint (clients)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8 on clients/
        run: |
          if [ -d "clients" ]; then
            flake8 clients
          else
            echo "No clients/ directory."
          fi

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on scripts/
        run: |
          if [ -d "scripts" ]; then
            find scripts -type f -name "*.sh" -print0 | xargs -0 -r shellcheck
          else
            echo "No scripts/ directory."
          fi