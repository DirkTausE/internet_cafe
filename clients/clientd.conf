# internetcafe clientd config
CLIENTD_SECRET="replace-with-long-random-token"
# Optional: client identifier (server may send "target": "pc-03")
CLIENTD_ID="pc-01"
# Host/port to bind (default 127.0.0.1:9999)
CLIENTD_HOST="127.0.0.1"
CLIENTD_PORT="9999"
# Directory with action scripts (each action -> actions/<action>.sh executable)
CLIENTD_ACTIONS_DIR="/usr/local/lib/clientd/actions"
# Comma-separated allowed remote IPs (server IPs). If empty, requests from any host are allowed.
CLIENTD_ALLOWED_HOSTS="127.0.0.1,192.168.1.10"
# Optional per-action execution timeout in seconds
CLIENTD_ACTION_TIMEOUT="25"