# internetcafe clientd config
# NOTE: Do NOT commit real secrets into the repository.
# Provide CLIENTD_SECRET and API_KEY via /etc/internetcafe-clientd.conf (this file) or via environment variables.
#
# Example (commented):
# CLIENTD_SECRET="replace-with-long-random-token"
# API_KEY="replace-with-api-key"

CLIENTD_ID="pc-01"
CLIENTD_HOST="127.0.0.1"
CLIENTD_PORT="9999"
CLIENTD_ACTIONS_DIR="/usr/local/lib/clientd/actions"
CLIENTD_ALLOWED_HOSTS="127.0.0.1,192.168.1.10"
CLIENTD_ACTION_TIMEOUT="25"
