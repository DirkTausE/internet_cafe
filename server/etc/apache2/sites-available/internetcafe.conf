<VirtualHost *:80>
    ServerName internetcafe.local
    DocumentRoot /var/www/internetcafe/web

    <Directory /var/www/internetcafe/web>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/internetcafe_error.log
    CustomLog ${APACHE_LOG_DIR}/internetcafe_access.log combined
</VirtualHost>